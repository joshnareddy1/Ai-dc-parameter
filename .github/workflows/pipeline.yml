name: DC Parametric Optimization Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e . || true

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: pytest tests/

      - name: Execute Full Pipeline
        env:
          PYTHONPATH: .
        run: python run_all.py

      - name: Upload Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-results
          path: results/
